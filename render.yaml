# Render Blueprint for the OpenJarvis FastAPI server.
# Deploys src/openjarvis/server/app.py via deploy/docker/Dockerfile.
services:
  - type: web
    name: openjarvis-server
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    # The service uses Google's Gemini Flash through the cloud engine.
    # Keep the CLI port aligned with Render's public service port.
    dockerCommand: serve --host 0.0.0.0 --port 10000 --engine cloud --model gemini-2.5-flash
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"

      # API authentication for the OpenJarvis server.
      - key: OPENJARVIS_API_KEY
        generateValue: true

      # Add the Gemini key as a secret in Render; never commit it to Git.
      - key: GEMINI_API_KEY
        sync: false

      # Render Free storage is ephemeral; see docs/deployment/render.md.
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
