name: Jarvis EDU CI
on:
  pull_request:
    paths:
      - "jarvis-edu/**"
  push:
    branches: [main, "feat/jarvis-edu"]
    paths:
      - "jarvis-edu/**"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-edu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
